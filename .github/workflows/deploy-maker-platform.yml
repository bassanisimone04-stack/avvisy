name: Deploy maker-platform

# Vercel does not deploy commits whose author is not linked to the Vercel account
# (e.g. commits made by Claude). A Deploy Hook has no such check, so every push to
# main that touches maker-platform/ triggers a Vercel build this way.
# Inactive until the secret VERCEL_DEPLOY_HOOK_MAKER_PLATFORM exists.
# Can also be run by hand: Actions -> "Deploy maker-platform" -> Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "maker-platform/**"
      - ".github/workflows/deploy-maker-platform.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MAKER_PLATFORM }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret VERCEL_DEPLOY_HOOK_MAKER_PLATFORM not set: no hook called."; exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
