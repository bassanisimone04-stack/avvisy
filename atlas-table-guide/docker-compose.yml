# Local services: PostgreSQL 16 + PostGIS and Typesense.
# The app itself runs with `npm run dev`. Apply schema with `npm run db:test` (throwaway) or
#   psql "$DATABASE_URL" -f supabase/tests/00_supabase_shim.sql  (plain Postgres only)
#   for f in supabase/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done && psql "$DATABASE_URL" -f supabase/seed.sql
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas
    ports: ["54322:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  typesense:
    image: typesense/typesense:27.1
    command: ["--data-dir", "/data", "--api-key", "local-dev-key", "--enable-cors"]
    ports: ["8108:8108"]
    volumes: ["tsdata:/data"]
volumes:
  pgdata: {}
  tsdata: {}
