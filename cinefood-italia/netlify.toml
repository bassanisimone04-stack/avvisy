# ============================================================
#  Configurazione per la pubblicazione su NETLIFY
# ============================================================
#  Come usarla (una volta sola):
#  1. Vai su https://app.netlify.com → "Add new site" → "Import an existing
#     project" e collega il repository GitHub.
#  2. Quando Netlify chiede le impostazioni, imposta:
#        Base directory:     cinefood-italia
#     (gli altri campi li legge da questo file automaticamente)
#  3. Clicca "Deploy". Fatto: a ogni push il sito si ricostruisce da solo.
#
#  Il comando di build:
#   - scarica le foto libere (scripts/scarica-foto.mjs) — se non riesce,
#     il sito usa comunque i placeholder e NON si blocca ("|| true");
#   - poi genera il sito statico con Astro.
# ============================================================

[build]
  command = "node scripts/scarica-foto.mjs || true; npm run build"
  publish = "dist"

[build.environment]
  # Astro 5 richiede Node 18.20.8+, 20.3+ o 22+.
  NODE_VERSION = "20"

# Header consigliati (cache lunga per gli asset con hash, sicurezza di base).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
